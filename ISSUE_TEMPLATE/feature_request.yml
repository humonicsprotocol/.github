name: Feature Request
description: Propose a new feature or improvement
labels: ["enhancement"]
body:
  - type: dropdown
    id: repo
    attributes:
      label: Repository
      options:
        - sdk
        - api
        - oracle-service
        - soroban-contracts
        - zk-circuits
        - dashboard
        - docs
        - core
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: breaking
    attributes:
      label: Breaking change?
      options:
        - label: This change would break existing integrations
